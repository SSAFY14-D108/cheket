# ============================================
# Nginx 리버스 프록시 설정 - CHEKET
# EC2의 /etc/nginx/sites-available/cheket 에 복사
# ============================================
#
# 사용법:
# 1. EC2에 이 파일 복사:
#    sudo cp cheket.conf /etc/nginx/sites-available/cheket
#
# 2. 심볼릭 링크 생성 (sites-enabled):
#    sudo ln -s /etc/nginx/sites-available/cheket /etc/nginx/sites-enabled/cheket
#
# 3. 기본 설정 제거:
#    sudo rm /etc/nginx/sites-enabled/default
#
# 4. SSL 인증서 발급:
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d j14d108.p.ssafy.io
#
# 5. 설정 확인 & 적용:
#    sudo nginx -t
#    sudo systemctl reload nginx
# ============================================

server {
    server_name j14d108.p.ssafy.io;

    # Backend API 프록시
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger API Docs
    location /v3/api-docs {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 컬렉션 WebView (Android 앱에서 사용)
    location /collection/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 기본 페이지 (프론트엔드 배포 전 임시)
    location / {
        return 200 'CHEKET Backend is running!';
        add_header Content-Type text/plain;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/j14d108.p.ssafy.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/j14d108.p.ssafy.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP → HTTPS 리다이렉트
server {
    if ($host = j14d108.p.ssafy.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name j14d108.p.ssafy.io;
    return 404; # managed by Certbot
}
