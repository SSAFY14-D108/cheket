# ============================================
# Nginx 리버스 프록시 설정 - CHEKET
# EC2의 /etc/nginx/sites-available/cheket 에 복사
# ============================================
#
# 사용법:
# 1. EC2에 이 파일 복사:
#    sudo cp cheket.conf /etc/nginx/sites-available/cheket
#
# 2. 심볼릭 링크 생성 (sites-enabled):
#    sudo ln -s /etc/nginx/sites-available/cheket /etc/nginx/sites-enabled/cheket
#
# 3. 기본 설정 제거:
#    sudo rm /etc/nginx/sites-enabled/default
#
# 4. 설정 확인 & 적용:
#    sudo nginx -t
#    sudo systemctl reload nginx
# ============================================

server {
    listen 80;
    server_name j14d108.p.ssafy.io;

    # Backend API 프록시
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger API Docs
    location /v3/api-docs {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 기본 페이지 (프론트엔드 배포 전 임시)
    location / {
        return 200 'CHEKET Backend is running!';
        add_header Content-Type text/plain;
    }
}

# ============================================
# HTTPS 설정 (SSL 인증서 발급 후 위 server 블록 대체)
# ============================================
# SSL 인증서 발급 방법:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d j14d108.p.ssafy.io
#
# certbot이 자동으로 이 설정 파일을 수정해줍니다.
