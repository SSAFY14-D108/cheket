# ============================================
# 배포용 Docker Compose (EC2에서 사용)
# ============================================
services:
  # ----- Backend (Spring Boot) -----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cheket_backend
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: "-Duser.timezone=Asia/Seoul"
      # Spring 설정 오버라이드
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - keystore_data:${KEYSTORE_DIR}
      - /home/ubuntu/firebase:/app/firebase
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cheket_network

  # ----- MySQL -----
  mysql:
    image: mysql:8.0.43
    container_name: cheket_mysql
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cheket_network

  # ----- Redis -----
  redis:
    image: redis:7.4-alpine
    container_name: cheket_redis
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cheket_network

  # ----- Blockscout (Block Explorer) -----
  blockscout-db:
    image: postgres:15
    container_name: cheket_blockscout_db
    environment:
      POSTGRES_PASSWORD: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_DB: blockscout
    volumes:
      - blockscout_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cheket_network

  blockscout:
    image: blockscout/blockscout:latest
    container_name: cheket_blockscout
    depends_on:
      blockscout-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blockscout:blockscout@blockscout-db:5432/blockscout
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_HTTP_URL: https://rpc.ssafy-blockchain.com
      ETHEREUM_JSONRPC_WS_URL: wss://ws.ssafy-blockchain.com
      CHAIN_ID: "31221"
      NETWORK: SSAFY
      SUBNETWORK: "SSAFY Blockchain"
      COIN: SSF
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      BLOCK_TRANSFORMER: base
      ECTO_USE_SSL: "false"
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - cheket_network

volumes:
  mysql_data:
  redis_data:
  keystore_data:
  blockscout_db_data:

networks:
  cheket_network:
    driver: bridge